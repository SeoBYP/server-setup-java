spring:
  application:
    name: hhplus
  profiles:
    active: local
  datasource:
    name: HangHaePlusDataSource
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 3
      connection-timeout: 10000
      max-lifetime: 60000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: update
  kafka:
    consumer:
      group-id: test-group
      auto-offset-reset: earliest
    properties:
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.time_zone: UTC
  redis:
    host: localhost
    port: 6379

---
spring.config.activate.on-profile: local, test

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/hhplus?characterEncoding=UTF-8&serverTimezone=UTC
    username: application
    password: application

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


app:
  redis:
    dlq:
      max-retry: 10
      dead-order-created: dead:dlq:order-created:v1
      retry-key-prefix:
        dlq:retry:order-created:
      max-batch: 10
      drain-interval-ms: 2000
      reclaim-interval-ms: 5000
      reclaim-idle-seconds: 60
      order-created: dlq:order-created:v1
    dlq-group:
      order-created: cg:dlq:order-created:v1
  kafka:
    bootstrap-servers: localhost:9092
    topics:
      coupon-claim-requested: coupon-claim-requested.v1
      coupon-claim-replied: coupon-claim-replied.v1
    consumers:
      group-id: hhplus-local
      coupon-claim:
        concurrency: 1   # 실습에서 1 -> 3 -> 6 으로 변경
      coupon-reply:
        concurrency: 1

server:
  port: 7777
